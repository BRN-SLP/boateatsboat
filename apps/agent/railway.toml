# Railway service config for the BoatEatsBoat AI agent.
# This is an always-on Node process (not a request/response function) that
# joins free "vs AI" duels, commits boards, fires shots, answers shots.
#
# Railway service Settings -> Root Directory must be: apps/agent
# Variables (set as secrets in the Railway dashboard):
#   AGENT_PRIVATE_KEY = 0x...  (bot wallet key)
#   GAME_CONTRACT     = 0xa05E6B19Dd828E955331C097e8Af4DBd0c42d3f9 (mainnet proxy)
#   CHAIN             = celo

[build]
  builder = "NIXPACKS"

[deploy]
  startCommand = "node dist/index.js"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
