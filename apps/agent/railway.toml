# Railway deployment config for the BoatEatsBoat AI agent.
# This service runs the always-on off-chain bot that joins free "vs AI" duels,
# commits boards, fires shots, and answers shots with Merkle proofs.
#
# Setup (one-time, in the Railway dashboard):
#   1. New Project -> Deploy from GitHub repo -> BRN-SLP/boateatsboat
#   2. Settings -> Root Directory: apps/agent
#   3. Variables (set as secret vars, never commit the real key):
#        AGENT_PRIVATE_KEY = 0x...   (the bot wallet key)
#        GAME_CONTRACT     = 0xa05E6B19Dd828E955331C097e8Af4DBd0c42d3f9  (mainnet proxy)
#        CHAIN             = celo
#   4. Fund the bot wallet (AGENT_ADDRESS = 0x21Fb8F9BA91864BB03F9a5ff6a8Fd648044119ae)
#      with ~0.5-1 CELO on mainnet for gas. Without gas the bot cannot move.

[build]
  builder = "nixpacks"

[deploy]
  startCommand = "node dist/index.js"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[nixpacks]
  # Nixpacks auto-detects pnpm and runs the "build" script (tsc) on deploy.
  # The monorepo uses pnpm workspaces; pinning the pnpm version keeps the
  # lockfile consistent with local dev.
  version = "8"
